name: Auto-increment CACHE_VERSION

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'core.js'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calc version and update sw.js
        run: |
          VERSION=$(python3 -c "
          import hashlib
          with open('index.html','rb') as f:
            h = hashlib.md5(f.read()).hexdigest()[:8]
          print(int(h,16) % 9999 + 1)
          ")
          echo "VERSION=$VERSION"
          sed -i "s/const CACHE_NAME *= *'mt-config-v[0-9]*'/const CACHE_NAME = 'mt-config-v${VERSION}'/" sw.js
          sed -i "s/const CACHE_VERSION *= *[0-9]*/const CACHE_VERSION = ${VERSION}/" sw.js
          grep "CACHE_" sw.js

      - name: Commit if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if git diff --quiet sw.js; then
            echo "No changes — skip"
          else
            git add sw.js
            git commit -m "ci: CACHE_VERSION auto-update [skip ci]"
            git push
          fi