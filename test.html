<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>MikroTik Config — Unit Tests v3</title>
<style>
  :root {
    --bg:#0f1720;--panel:#16212c;--border:#2a3b48;
    --text:#e6edf3;--muted:#8ea3b0;--accent:#5fd0a5;
    --pass:#5fd0a5;--fail:#e0665a;
    --mono:'Cascadia Code','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;
       padding:32px 24px;max-width:900px;margin:auto;}
  h1{color:var(--accent);font-size:22px;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px;}
  .summary{display:flex;gap:24px;align-items:center;
    background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:14px 20px;margin-bottom:16px;}
  .num{font-size:28px;font-weight:700;line-height:1;}
  .pass-num{color:var(--pass);}
  .fail-num{color:var(--fail);}
  .total-num{color:var(--muted);}
  .progress{height:6px;background:var(--border);border-radius:3px;margin-bottom:24px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}
  .suite{margin-bottom:20px;}
  .suite-title{font-size:12px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-left:4px;}
  .test{background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;}
  .test.pass{border-left:3px solid var(--pass);}
  .test.fail{border-left:3px solid var(--fail);}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    white-space:nowrap;flex-shrink:0;}
  .badge.pass{background:rgba(95,208,165,.18);color:var(--pass);}
  .badge.fail{background:rgba(224,102,90,.18);color:var(--fail);}
  .test-body{flex:1;}
  .test-name{font-size:13.5px;}
  .test-detail{font-family:var(--mono);font-size:11.5px;color:var(--muted);
    margin-top:5px;line-height:1.6;}
  .got{color:var(--fail);}
  .want{color:var(--pass);}
  .status-box{font-size:12px;padding:8px 14px;border-radius:6px;
    margin-bottom:16px;background:var(--panel);border:1px solid var(--border);}
  footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center;}
</style>
</head>
<body>
<h1>&#129514; Unit Tests v3 — MikroTik Config Generator</h1>
<p class="sub">Тестує реальний код з <b>core.js</b> — не копії функцій</p>

<div id="core-status" class="status-box">&#9203; Завантаження core.js...</div>

<div class="summary">
  <div><div class="num pass-num" id="s-pass">&#8212;</div>
       <div style="color:var(--muted);font-size:12px">пройшло</div></div>
  <div><div class="num fail-num" id="s-fail">&#8212;</div>
       <div style="color:var(--muted);font-size:12px">провалено</div></div>
  <div><div class="num total-num" id="s-total">&#8212;</div>
       <div style="color:var(--muted);font-size:12px">всього</div></div>
  <div style="margin-left:auto;font-size:13px;color:var(--muted)" id="s-time"></div>
</div>
<div class="progress"><div class="progress-fill" id="progress" style="width:0%"></div></div>
<div id="results"></div>
<footer>MikroTik Config Generator &middot; Unit Test Suite v3 &middot; core.js</footer>

<script src="core.js"></script>
<script>
'use strict';

/* ── Перевірка core.js ── */
var CORE_FUNCS = ['isIPv4','isCIDR','isPort','isMac','calcNet','q','sip','lineValue'];
var coreOk = CORE_FUNCS.every(function(f){ return typeof window[f]==='function'; });

var statusEl = document.getElementById('core-status');
if (coreOk) {
  statusEl.style.borderColor = '#5fd0a5';
  statusEl.style.color       = '#5fd0a5';
  statusEl.textContent = '\u2713 core.js завантажено (' + CORE_FUNCS.length + ' функцій перевірено)';
} else {
  statusEl.style.borderColor = '#e0665a';
  statusEl.style.color       = '#e0665a';
  var missing = CORE_FUNCS.filter(function(f){ return typeof window[f]!=='function'; });
  statusEl.textContent = '\u2717 Відсутні функції: ' + missing.join(', ') +
    ' — запусти через http-сервер!';
}

/* ── Test Engine ── */
var results = [];

function expect(desc, got, want) {
  var pass = JSON.stringify(got) === JSON.stringify(want);
  results.push({ desc: desc, pass: pass, got: got, want: want });
}

function renderResult(item, container) {
  var div = document.createElement('div');
  div.className = 'test ' + (item.pass ? 'pass' : 'fail');
  div.innerHTML =
    '<span class="badge ' + (item.pass ? 'pass">\u2713 PASS' : 'fail">\u2717 FAIL') + '</span>' +
    '<div class="test-body">' +
      '<div class="test-name">' + String(item.desc).replace(/</g,'&lt;') + '</div>' +
      (!item.pass
        ? '<div class="test-detail">' +
            '\u0686\u043e\u0442\u0438\u0440\u0438\u0440\u0435\u0447\u043d\u0438\u043a\u0438 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043e:&nbsp;&nbsp; <span class="got">'  +
            JSON.stringify(item.got)  + '</span><br>' +
            '\u043e\u0447\u0456\u043a\u0443\u0454\u0442\u044c\u0441\u044f: <span class="want">' +
            JSON.stringify(item.want) + '</span>' +
          '</div>'
        : '') +
    '</div>';
  container.appendChild(div);
}

function suite(name, fn) {
  var el = document.createElement('div');
  el.className = 'suite';
  el.innerHTML = '<div class="suite-title">' + name + '</div>';
  document.getElementById('results').appendChild(el);
  if (coreOk) fn(el);
}

if (!coreOk) {
  document.getElementById('s-pass').textContent  = '?';
  document.getElementById('s-fail').textContent  = '?';
  document.getElementById('s-total').textContent = '?';
} else {

/* ══════════════════════════════════════════════════════════
   q() — ЕКРАНУВАННЯ ROUTEROS
   
   ВАЖЛИВО: очікувані значення — це те що RouterOS отримає.
   RouterOS правила:
     \  →  \\
     $  →  \$
     "  →  \"
     %  →  \%
     \n →  (видаляється)
══════════════════════════════════════════════════════════ */
suite('q() \u2014 \u0435\u043a\u0440\u0430\u043d\u0443\u0432\u0430\u043d\u043d\u044f RouterOS', function(c) {
  /* Кожен тест: [опис, вхід, очікуваний вихід] */
  var BS   = '\\';          /* один бекслеш */
  var DOBS = '\\\\';        /* два бекслеші */

  var cases = [
    /* Базові */
    ['null \u2192 порожній рядок',    q(null),      ''],
    ['undefined \u2192 порожній',     q(undefined), ''],
    ['порожній рядок',                q(''),         ''],
    ['звичайний рядок',              q('hello'),    'hello'],
    ['число',                        q(42),          '42'],

    /* Бекслеш: \ → \\ */
    ['один бекслеш',   q(BS),    DOBS],
    ['два бекслеші',   q(DOBS),  DOBS+DOBS],

    /* Подвійні лапки: " → \" */
    ['лапки "',               q('"'),          BS+'"'],
    ['рядок say "hi"',        q('say "hi"'),   'say '+BS+'"hi'+BS+'"'],

    /* Долар: $ → \$ */
    ['$var',   q('$var'),   BS+'$var'],
    ['$a $b',  q('$a $b'),  BS+'$a '+BS+'$b'],

    /* Відсоток: % → \% */
    ['100%',      q('100%'),       '100'+BS+'%'],
    ['50% off',   q('50% off'),    '50'+BS+'% off'],

    /* Переноси рядка видаляються */
    ['newline \u2192 видалено',   q('a\nb'),   'ab'],
    ['CR \u2192 видалено',        q('a\rb'),   'ab'],
    ['CRLF \u2192 видалено',      q('a\r\nb'), 'ab'],

    /* Комбінований пароль */
    ['P@ss"$100%',  q('P@ss"$100%'),  'P@ss'+BS+'"'+BS+'$100'+BS+'%'],
  ];

  cases.forEach(function(t) {
    expect(t[0], t[1], t[2]);
    renderResult(results[results.length-1], c);
  });
});

/* ══════════════════════════════════════════════════════════
   isIPv4()
══════════════════════════════════════════════════════════ */
suite('isIPv4() \u2014 \u0432\u0430\u043b\u0456\u0434\u0430\u0446\u0456\u044f IPv4', function(c) {
  var cases = [
    ['192.168.1.1',       isIPv4('192.168.1.1'),       true],
    ['0.0.0.0',           isIPv4('0.0.0.0'),            true],
    ['255.255.255.255',   isIPv4('255.255.255.255'),    true],
    ['10.0.0.1',          isIPv4('10.0.0.1'),           true],
    ['172.16.254.254',    isIPv4('172.16.254.254'),     true],
    ['256.0.0.1',         isIPv4('256.0.0.1'),          false],
    ['192.168.1',         isIPv4('192.168.1'),           false],
    ['192.168.1.1.5',     isIPv4('192.168.1.1.5'),      false],
    ['abc.def.ghi.jkl',  isIPv4('abc.def.ghi.jkl'),   false],
    ['',                  isIPv4(''),                    false],
    [null,                isIPv4(null),                  false],
    ['192.168.-1.1',      isIPv4('192.168.-1.1'),       false],
    ['192.168.1.256',     isIPv4('192.168.1.256'),      false],
  ];
  cases.forEach(function(t) {
    expect(String(t[0]), t[1], t[2]);
    renderResult(results[results.length-1], c);
  });
});

/* ══════════════════════════════════════════════════════════
   isCIDR()
══════════════════════════════════════════════════════════ */
suite('isCIDR() \u2014 \u0432\u0430\u043b\u0456\u0434\u0430\u0446\u0456\u044f CIDR', function(c) {
  var cases = [
    ['192.168.1.0/24',   isCIDR('192.168.1.0/24'),    true],
    ['10.0.0.0/8',       isCIDR('10.0.0.0/8'),         true],
    ['0.0.0.0/0',        isCIDR('0.0.0.0/0'),          true],
    ['192.168.1.1/32',   isCIDR('192.168.1.1/32'),     true],
    ['172.16.0.0/16',    isCIDR('172.16.0.0/16'),      true],
    ['192.168.1.1',      isCIDR('192.168.1.1'),         false],
    ['192.168.1.0/33',   isCIDR('192.168.1.0/33'),     false],
    ['192.168.1.0/-1',   isCIDR('192.168.1.0/-1'),     false],
    ['256.0.0.1/24',     isCIDR('256.0.0.1/24'),       false],
    ['',                 isCIDR(''),                    false],
    [null,               isCIDR(null),                  false],
    ['192.168.1.0/abc',  isCIDR('192.168.1.0/abc'),    false],
  ];
  cases.forEach(function(t) {
    expect(String(t[0]), t[1], t[2]);
    renderResult(results[results.length-1], c);
  });
});

/* ══════════════════════════════════════════════════════════
   isPort()
══════════════════════════════════════════════════════════ */
suite('isPort() \u2014 \u0432\u0430\u043b\u0456\u0434\u0430\u0446\u0456\u044f \u043f\u043e\u0440\u0442\u0456\u0432', function(c) {
  var cases = [
    [80,    isPort(80),    true],
    [1,     isPort(1),     true],
    [65535, isPort(65535), true],
    [8080,  isPort(8080),  true],
    [443,   isPort(443),   true],
    [0,     isPort(0),     false],
    [65536, isPort(65536), false],
    [-1,    isPort(-1),    false],
    ['abc', isPort('abc'), false],
    ['',    isPort(''),    false],
  ];
  cases.forEach(function(t) {
    expect(String(t[0]), t[1], t[2]);
    renderResult(results[results.length-1], c);
  });
});

/* ══════════════════════════════════════════════════════════
   isMac()
══════════════════════════════════════════════════════════ */
suite('isMac() \u2014 \u0432\u0430\u043b\u0456\u0434\u0430\u0446\u0456\u044f MAC', function(c) {
  var cases = [
    ['AA:BB:CC:DD:EE:FF',  isMac('AA:BB:CC:DD:EE:FF'),  true],
    ['aa:bb:cc:dd:ee:ff',  isMac('aa:bb:cc:dd:ee:ff'),  true],
    ['AA-BB-CC-DD-EE-FF',  isMac('AA-BB-CC-DD-EE-FF'),  true],
    ['00:00:00:00:00:00',  isMac('00:00:00:00:00:00'),  true],
    ['ff:ff:ff:ff:ff:ff',  isMac('ff:ff:ff:ff:ff:ff'),  true],
    ['ZZ:BB:CC:DD:EE:FF',  isMac('ZZ:BB:CC:DD:EE:FF'),  false],
    ['AA:BB:CC:DD:EE',     isMac('AA:BB:CC:DD:EE'),      false],
    ['AA:BB:CC:DD:EE:FF:00',isMac('AA:BB:CC:DD:EE:FF:00'),false],
    ['',                   isMac(''),                    false],
    [null,                 isMac(null),                  false],
    ['GG:HH:II:JJ:KK:LL',  isMac('GG:HH:II:JJ:KK:LL'), false],
  ];
  cases.forEach(function(t) {
    expect(String(t[0]), t[1], t[2]);
    renderResult(results[results.length-1], c);
  });
});

/* ══════════════════════════════════════════════════════════
   calcNet()
══════════════════════════════════════════════════════════ */
suite('calcNet() \u2014 \u043c\u0435\u0440\u0435\u0436\u0435\u0432\u0430 \u0430\u0434\u0440\u0435\u0441\u0430', function(c) {
  var cases = [
    ['192.168.1.5/24',    calcNet('192.168.1.5/24'),    '192.168.1.0/24'],
    ['10.0.0.1/8',        calcNet('10.0.0.1/8'),        '10.0.0.0/8'],
    ['172.16.5.10/16',    calcNet('172.16.5.10/16'),    '172.16.0.0/16'],
    ['192.168.88.1/24',   calcNet('192.168.88.1/24'),   '192.168.88.0/24'],
    ['192.168.1.1/32',    calcNet('192.168.1.1/32'),    '192.168.1.1/32'],
    ['10.10.10.10/0',     calcNet('10.10.10.10/0'),     '0.0.0.0/0'],
    ['192.168.1.0/24',    calcNet('192.168.1.0/24'),    '192.168.1.0/24'],
    ['10.0.0.5/30',       calcNet('10.0.0.5/30'),       '10.0.0.4/30'],
    ['10.20.30.1/24',     calcNet('10.20.30.1/24'),     '10.20.30.0/24'],
    ['10.10.10.1/24',     calcNet('10.10.10.1/24'),     '10.10.10.0/24'],
    ['192.168.0.255/24',  calcNet('192.168.0.255/24'),  '192.168.0.0/24'],
    ['10.0.0.1/30',       calcNet('10.0.0.1/30'),       '10.0.0.0/30'],
  ];
  cases.forEach(function(t) {
    expect(t[0], t[1], t[2]);
    renderResult(results[results.length-1], c);
  });
});

/* ══════════════════════════════════════════════════════════
   Підсумок
══════════════════════════════════════════════════════════ */
var passed = results.filter(function(r){ return r.pass; }).length;
var failed = results.length - passed;
var pct    = results.length > 0 ? Math.round(passed/results.length*100) : 0;

document.getElementById('s-pass').textContent  = passed;
document.getElementById('s-fail').textContent  = failed;
document.getElementById('s-total').textContent = results.length;
document.getElementById('s-time').textContent  = pct + '% \u0443\u0441\u043f\u0456\u0448\u043d\u043e';

var fill = document.getElementById('progress');
fill.style.width      = pct + '%';
fill.style.background = failed === 0 ? 'var(--pass)' : 'var(--fail)';

} /* end if coreOk */
</script>
</body>
</html>
