name: CI Test
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS syntax check
        run: |
          FAILED=0
          for f in *.js; do
            node --check "$f" 2>&1 && echo "✅ $f" || { echo "❌ $f"; FAILED=1; }
          done
          exit $FAILED

      - name: HTML check
        run: |
          python3 -c "
          with open('index.html', encoding='utf-8') as f:
              c = f.read()
          assert '</html>' in c
          print('✅ HTML OK')
          "